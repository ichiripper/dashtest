<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Userside map — light</title>
  <style>
    :root {
      --color-text: #314158;
      --color-link: #0076e2;
      --color-primary-400: #40b2e0;
      --color-primary-600: #0079ab;
      --color-muted-deep: #7a8499;
      --color-white: #fff;
      --btn-link-info-fg: var(--color-link);
      --btn-link-info-fg-hover: var(--color-primary-400);
      --btn-link-info-fg-active: var(--color-primary-600);
      --btn-motion: background-color 0.15s ease, color 0.15s ease;
      --text-base: 16px;
      --weight-medium: 500;
      --space-xs: 6px;
      --bg: #f4f6f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--color-text);
      background: var(--bg);
    }

    .light {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 16px;
    }

    .contract__switch-place {
      margin: 0;
      display: inline-flex;
      align-items: flex-start;
      gap: var(--space-xs);
      font-size: var(--text-base);
      line-height: 20px;
      font-weight: var(--weight-medium);
      color: var(--color-text);
    }

    .contract__icon {
      flex-shrink: 0;
      display: block;
      color: var(--color-link);
    }

    .contract__switch-place-text {
      white-space: pre-wrap;
      word-break: break-word;
      color: inherit;
      text-decoration: none;
    }

    .contract__switch-place-text--link {
      color: var(--btn-link-info-fg);
      text-decoration: underline;
      cursor: pointer;
      transition: var(--btn-motion);
    }

    .contract__switch-place-text--link:hover {
      color: var(--btn-link-info-fg-hover);
    }

    .contract__switch-place-text--link:active {
      color: var(--btn-link-info-fg-active);
    }
  </style>
</head>
<body>
  <main class="light">
    <div class="contract__switch-place">
      <svg class="contract__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M18.3641 4.63606C20.0164 6.28819 20.9614 8.51817 20.9993 10.8545C21.0372 13.1908 20.1649 15.4502 18.5671 17.1551L18.3641 17.3651L14.1211 21.6071C13.5827 22.1451 12.8599 22.4584 12.0992 22.4834C11.3385 22.5085 10.5967 22.2435 10.0241 21.7421L9.88006 21.6071L5.63606 17.3641C3.94822 15.6762 3 13.387 3 11.0001C3 8.61309 3.94822 6.32389 5.63606 4.63606C7.32389 2.94822 9.61309 2 12.0001 2C14.387 2 16.6762 2.94822 18.3641 4.63606ZM12.0001 8.00006C11.6061 8.00006 11.216 8.07765 10.852 8.22842C10.488 8.37918 10.1573 8.60016 9.87873 8.87873C9.60016 9.15731 9.37918 9.48803 9.22842 9.85201C9.07765 10.216 9.00006 10.6061 9.00006 11.0001C9.00006 11.394 9.07765 11.7841 9.22842 12.1481C9.37918 12.5121 9.60016 12.8428 9.87873 13.1214C10.1573 13.4 10.488 13.6209 10.852 13.7717C11.216 13.9225 11.6061 14.0001 12.0001 14.0001C12.7957 14.0001 13.5588 13.684 14.1214 13.1214C14.684 12.5588 15.0001 11.7957 15.0001 11.0001C15.0001 10.2044 14.684 9.44134 14.1214 8.87873C13.5588 8.31613 12.7957 8.00006 12.0001 8.00006Z" fill="currentColor"/>
      </svg>
      <a
        id="openLink"
        class="contract__switch-place-text contract__switch-place-text--link"
        href="#"
      >Махачкала, Героев Дагестана, улица, 10в (Али-Гаджи Акушинского, 30/А) п.1 #550</a>
    </div>
  </main>

  <script>
    (function () {
      var MAP_URL = 'https://userside.r-line.ru/map/show?embed=1&no_header=1&opt_wnode_4=1&by_node=557&is_show_center_marker=1@42.982561,47.461361,18z';
      var openLink = document.getElementById('openLink');

      function openMapPopup(e) {
        if (e) e.preventDefault();
        var url = (MAP_URL || '').trim();
        if (!url) return;

        // Размеры окна
        var width = 1000;
        var height = 720;

        // Центрирование окна относительно экрана пользователя
        var left = (window.screen.width - width) / 2;
        var top = (window.screen.height - height) / 2;

        var popupFeatures = [
          'width=' + width,
          'height=' + height,
          'top=' + top,
          'left=' + left,
          'resizable=yes',
          'scrollbars=yes',
          'status=no',
          'toolbar=no',
          'menubar=no',
          'location=no'
        ].join(',');

        var popup = window.open(url, 'UsersideMapPopup', popupFeatures);
        if (popup) {
          popup.focus();
        }
      }

      openLink.addEventListener('click', openMapPopup);
    })();
  </script>
</body>
</html>
